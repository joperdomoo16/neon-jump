name: neon_jump
description: "Neon Jump: juego arcade de salto vertical en Flutter y WebView con servicios nativos."
publish_to: 'none'

version: 1.1.4+27

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  google_mobile_ads: ^9.0.0
  vibration: ^3.2.0
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.2.1
  firebase_app_check: ^0.4.8
  in_app_update: ^5.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  # 23.x exige compileSdk 37 y AGP 9.1; el proyecto usa compileSdk 36 y AGP 9.0
  flutter_local_notifications: ">=22.3.3 <23.0.0"
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/juego/
    - assets/juego/Estilos/
    - assets/juego/Codigo/
    - assets/juego/Imagenes/
    # Anuncios propios (Khronos y MiTecho) que salen cuando AdMob no tiene anuncio
    - assets/juego/Anuncios/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0C29"
  adaptive_icon_foreground: "assets/icon/logo.png"
