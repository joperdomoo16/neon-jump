name: neon_jump
description: "A hyper-casual neon jumping game."
publish_to: 'none'

version: 1.0.10+13

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.1.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.2.3
  vibration: ^3.2.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.2.1
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0C29"
  adaptive_icon_foreground: "assets/images/logo.png"
