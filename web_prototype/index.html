<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON JUMP PROTOTYPE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #0F0C29 0%, #302B63 100%);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevent scrolling on mobile */
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: transparent;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #ui {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            max-width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff;
        }
        .coins {
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #f0f;
            box-shadow: 0 0 20px #f0f;
            pointer-events: auto;
        }
        h1 {
            color: #fff;
            text-shadow: 0 0 20px #f00;
            margin-top: 0;
        }
        button {
            background: rgba(0, 255, 255, 0.2);
            color: white;
            border: 2px solid #0ff;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            text-shadow: 0 0 10px #0ff;
            box-shadow: 0 0 10px #0ff;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }
        .menu-title {
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 50px;
            text-shadow: 0 0 20px #0ff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); text-shadow: 0 0 20px #0ff; }
            to { transform: scale(1.1); text-shadow: 0 0 40px #0ff, 0 0 60px #0ff; }
        }
        #shop-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            padding-top: 50px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .skin-item {
            width: 100px;
            height: 100px;
            border: 2px solid #555;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #111;
        }
        .skin-item.owned { border-color: #888; }
        .skin-item.equipped { border-color: #fff; box-shadow: 0 0 10px #fff; }
        .skin-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            width: 80%;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="800"></canvas>
    
    <div id="ui">
        <div class="hud" id="hud" style="display: none;">
            <div id="score">0</div>
            <div class="coins" id="coins">🪙 0</div>
        </div>
        
        <div id="game-over">
            <h1>GAME OVER</h1>
            <h2 id="final-score">Score: 0</h2>
            <button onclick="revive()">REVIVE (AD)</button><br>
            <button onclick="restart()">RETRY</button>
        </div>
    </div>

    <div class="menu-screen" id="menu">
        <div class="menu-title">NEON<br>JUMP</div>
        <button onclick="startGame()" style="font-size: 24px; padding: 15px 40px;">PLAY</button>
        <button onclick="openShop()" style="font-size: 20px; border-color: #f0f; color: #fff; text-shadow: 0 0 10px #f0f; box-shadow: 0 0 10px #f0f;">SHOP</button>
    </div>

    <div id="shop-screen">
        <div class="shop-header">
            <span style="color:#f0f; text-shadow:0 0 10px #f0f;">SHOP</span>
            <span class="coins" id="shop-coins">🪙 0</span>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <button onclick="closeShop()" style="margin-top: 40px;">BACK</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Adjust canvas to window height
        function resize() {
            const ratio = window.innerHeight / 800;
            if (window.innerWidth < 400) {
                canvas.style.width = window.innerWidth + 'px';
            }
            canvas.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let state = 'menu'; // menu, playing, gameover, shop
        let score = 0;
        let coins = 0; // Load from local storage ideally, but keep 0 for session
        
        let skins = [
            {color: '#0ff', cost: 0, owned: true},
            {color: '#f0f', cost: 10, owned: false},
            {color: '#ff0', cost: 25, owned: false},
            {color: '#0f0', cost: 50, owned: false},
            {color: '#f80', cost: 100, owned: false},
            {color: '#80f', cost: 200, owned: false}
        ];
        let currentSkin = 0;
        let cameraY = 0;
        let highestPlatformY = 0;
        let frames = 0;

        // Input
        let keys = {};
        let touchX = null;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
        window.addEventListener('touchmove', e => touchX = e.touches[0].clientX);
        window.addEventListener('touchend', e => touchX = null);

        // Entities
        const player = {
            x: 200, y: 700, radius: 15, vy: 0, vx: 0,
            gravity: 15, jump: -800, speed: 400,
            color: '#0ff'
        };

        let platforms = [];
        let collectibles = [];
        let stars = [];

        // Init stars
        for(let i=0; i<50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        function createPlatform(y) {
            let type = 'normal';
            let color = '#f0f';
            const r = Math.random();
            
            // Difficulty scaling
            const movingProb = Math.min(0.1 + (score/5000), 0.4);
            const fragileProb = Math.min(0.05 + (score/10000), 0.2);
            
            if (r < fragileProb) {
                type = 'fragile';
                color = '#f00';
            } else if (r < fragileProb + movingProb) {
                type = 'moving';
                color = '#ff0';
            } else if (r < fragileProb + movingProb + 0.05) {
                type = 'spring';
                color = '#0f0';
            }

            platforms.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: y,
                width: 80,
                height: 15,
                type: type,
                color: color,
                broken: false,
                initialX: 0,
                time: Math.random() * 100
            });
            
            // Coin
            if (Math.random() < 0.1 && type !== 'fragile') {
                collectibles.push({
                    x: platforms[platforms.length-1].x,
                    y: y - 30,
                    radius: 8,
                    collected: false
                });
            }
        }

        function initGame() {
            player.x = 200;
            player.y = 400;
            player.vy = 0;
            player.vx = 0;
            player.color = skins[currentSkin].color;
            cameraY = 0;
            score = 0;
            platforms = [];
            collectibles = [];
            
            highestPlatformY = 600;
            platforms.push({x: 200, y: 600, width: 80, height: 15, type: 'normal', color: '#f0f'});
            
            for(let i=0; i<10; i++) generatePlatforms();
        }

        function generatePlatforms() {
            let gap = Math.min(100 + (score/1000)*50, 250);
            highestPlatformY -= gap;
            createPlatform(highestPlatformY);
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            initGame();
            state = 'playing';
        }

        function restart() {
            document.getElementById('game-over').style.display = 'none';
            initGame();
            state = 'playing';
        }

        function revive() {
            document.getElementById('game-over').style.display = 'none';
            player.x = 200;
            player.y = cameraY - canvas.height/2;
            player.vy = 0;
            platforms.push({x: 200, y: player.y + 100, width: 80, height: 15, type: 'normal', color: '#f0f'});
            state = 'playing';
        }

        function gameOver() {
            state = 'gameover';
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = 'Score: ' + score;
        }

        function openShop() {
            state = 'shop';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('shop-screen').style.display = 'flex';
            renderShop();
        }

        function closeShop() {
            state = 'menu';
            document.getElementById('shop-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function renderShop() {
            document.getElementById('shop-coins').innerText = '🪙 ' + coins;
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            
            skins.forEach((skin, index) => {
                const item = document.createElement('div');
                item.className = 'skin-item' + (skin.owned ? ' owned' : '') + (currentSkin === index ? ' equipped' : '');
                
                let label = skin.owned ? (currentSkin === index ? 'EQUIPPED' : 'OWNED') : '🪙 ' + skin.cost;
                
                item.innerHTML = `
                    <div class="skin-circle" style="background: ${skin.color}; box-shadow: 0 0 15px ${skin.color}"></div>
                    <div style="font-size:12px">${label}</div>
                `;
                
                item.onclick = () => {
                    if (skin.owned) {
                        currentSkin = index;
                        renderShop();
                    } else if (coins >= skin.cost) {
                        coins -= skin.cost;
                        skin.owned = true;
                        currentSkin = index;
                        renderShop();
                    } else {
                        alert('Not enough coins!');
                    }
                };
                grid.appendChild(item);
            });
        }

        let lastTime = performance.now();

        function update() {
            let now = performance.now();
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if(dt > 0.1) dt = 0.1; // cap dt
            
            if (state !== 'playing') return;

            frames++;

            // Input
            let moveDir = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) moveDir = -1;
            if (keys['ArrowRight'] || keys['KeyD']) moveDir = 1;
            
            if (touchX !== null) {
                const rect = canvas.getBoundingClientRect();
                const center = rect.left + rect.width / 2;
                moveDir = touchX < center ? -1 : 1;
            }

            if (moveDir < 0) player.vx -= 2000 * dt;
            else if (moveDir > 0) player.vx += 2000 * dt;
            else {
                if (player.vx > 0) player.vx = Math.max(0, player.vx - 1500 * dt);
                if (player.vx < 0) player.vx = Math.min(0, player.vx + 1500 * dt);
            }
            
            player.vx = Math.max(-500, Math.min(500, player.vx));

            // Physics
            player.vy += 1200 * dt;
            player.x += player.vx * dt;
            player.y += player.vy * dt;

            // Wrap
            if (player.x > canvas.width + player.radius) player.x = -player.radius;
            else if (player.x < -player.radius) player.x = canvas.width + player.radius;

            // Camera
            if (player.y < cameraY) {
                cameraY = player.y;
                let currentScore = Math.floor(-cameraY / 10);
                if (currentScore > score) score = currentScore;
            }

            // Platform Gen
            if (highestPlatformY > cameraY - canvas.height) {
                generatePlatforms();
            }

            // Collisions
            platforms.forEach(p => {
                if (p.broken) return;
                
                if (p.type === 'moving') {
                    if (!p.initialX) p.initialX = p.x;
                    p.x = p.initialX + Math.sin(frames * 0.05) * 100;
                }

                // Check collision only falling down
                if (player.vy > 0) {
                    if (player.x + player.radius > p.x - p.width/2 && 
                        player.x - player.radius < p.x + p.width/2 &&
                        player.y + player.radius > p.y - p.height/2 &&
                        player.y - player.radius < p.y - p.height/2 + 20) {
                        
                        // Bounce!
                        player.vy = p.type === 'spring' ? -1200 : -800;
                        if (p.type === 'fragile') p.broken = true;
                    }
                }
            });

            // Coins
            collectibles.forEach(c => {
                if (!c.collected) {
                    let dx = player.x - c.x;
                    let dy = player.y - c.y;
                    if (Math.sqrt(dx*dx + dy*dy) < player.radius + c.radius) {
                        c.collected = true;
                        coins++;
                    }
                }
            });

            // Cleanup
            platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100);
            collectibles = collectibles.filter(c => c.y < cameraY + canvas.height + 100 && !c.collected);

            // Game Over
            if (player.y > cameraY + canvas.height + player.radius) {
                gameOver();
            }

            // UI
            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = '🪙 ' + coins;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw relative to camera
            let camOffset = canvas.height / 2 - cameraY;

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            stars.forEach(s => {
                let sy = (s.y + camOffset * s.speed) % canvas.height;
                if(sy < 0) sy += canvas.height;
                ctx.beginPath();
                ctx.arc(s.x, sy, s.size, 0, Math.PI*2);
                ctx.fill();
            });

            if (state === 'menu') return;

            // Platforms
            platforms.forEach(p => {
                if (p.broken) return;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                
                if (p.type === 'fragile') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x - p.width/2, p.y + camOffset - p.height/2, p.width, p.height);
                } else {
                    ctx.fillRect(p.x - p.width/2, p.y + camOffset - p.height/2, p.width, p.height);
                }

                if (p.type === 'spring') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(p.x - 10, p.y + camOffset - p.height/2 - 5, 20, 5);
                }
            });

            // Coins
            ctx.fillStyle = '#ff0';
            ctx.shadowColor = '#ff0';
            collectibles.forEach(c => {
                if(!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y + camOffset, c.radius, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            // Player
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y + camOffset, player.radius, 0, Math.PI*2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
